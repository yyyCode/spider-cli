# DeepSeek 网页搜索与抓取配置
# 复制本文件为 config.ini，填入 api_key 后使用。
# config.ini 已被 .gitignore 忽略，不会提交到 Git。
#
# api_key 也可以改用环境变量 DEEPSEEK_API_KEY 提供，环境变量优先。

[deepseek]
api_key =
base_url = https://api.deepseek.com

# 连接超时与读取超时（秒）
connect_timeout = 10
read_timeout = 60

# 搜索页默认值
default_count = 10
need_content = false

# 408 / 429 / 5xx 的自动重试次数与基础退避时间（秒）
max_retries = 2
retry_backoff = 0.5
